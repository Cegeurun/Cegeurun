name: Metrics

on:
  # Runs every day at midnight UTC
  schedule: [{cron: "0 0 * * *"}]
  # Allow running manually from Actions tab
  workflow_dispatch:
  # Update when pushing to main branch
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          output_action: commit        # 👈 saves the file into your repo
          plugin_languages: yes
          plugin_languages_limit: 0    # show ALL languages
          plugin_languages_threshold: 0% # include even tiny ones like SQL
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
